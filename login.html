<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Access - Gustav Thunberg</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-background: #ffffff;
            --color-text-primary: #1a1a1a;
            --color-text-secondary: #666666;
            --color-border: #e0e0e0;
            --color-error: #ef4444;
            --font-primary: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
            --space-md: 0.75rem;
            --space-lg: 1.25rem;
            --space-xl: 1.5rem;
            --space-2xl: 2rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: #0a0a0a;
                --color-text-primary: #f5f5f5;
                --color-text-secondary: #a3a3a3;
                --color-border: #262626;
            }
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--color-background);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
        }

        .login-container {
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: var(--space-md);
        }

        .login-subtitle {
            font-size: 0.9375rem;
            color: var(--color-text-secondary);
        }

        .login-form {
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-2xl);
        }

        .form-group {
            margin-bottom: var(--space-lg);
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: var(--space-md);
            color: var(--color-text-primary);
        }

        .form-input {
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            font-family: var(--font-primary);
            font-size: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-background);
            color: var(--color-text-primary);
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-text-primary);
        }

        .form-input.error {
            border-color: var(--color-error);
        }

        .error-message {
            display: none;
            color: var(--color-error);
            font-size: 0.875rem;
            margin-top: var(--space-md);
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            font-family: var(--font-primary);
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-md);
            background: var(--color-text-primary);
            color: var(--color-background);
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">G.Thunberg</h1>
            <p class="login-subtitle">Enter password to view portfolio</p>
        </div>

        <form class="login-form" id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >
                <div class="error-message" id="errorMessage">
                    Incorrect password. Please try again.
                </div>
            </div>
            <button type="submit" class="submit-btn">Access Portfolio</button>
        </form>
    </div>

    <script>
        const CORRECT_PASSWORD = 'Bonnie';
        const AUTH_KEY = 'portfolio_auth';
        const SEVEN_HOURS = 7 * 60 * 60 * 1000; // 7 hours in milliseconds

        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');

        // Check if already authenticated
        function checkAuth() {
            const auth = localStorage.getItem(AUTH_KEY);
            if (auth) {
                const authData = JSON.parse(auth);
                const now = new Date().getTime();

                // Check if authentication is still valid (within 7 hours)
                if (now - authData.timestamp < SEVEN_HOURS) {
                    window.location.href = 'index.html';
                    return true;
                } else {
                    // Clear expired auth
                    localStorage.removeItem(AUTH_KEY);
                }
            }
            return false;
        }

        // Set authentication
        function setAuth() {
            const authData = {
                authenticated: true,
                timestamp: new Date().getTime()
            };
            localStorage.setItem(AUTH_KEY, JSON.stringify(authData));
        }

        // Handle form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const password = passwordInput.value;

            if (password === CORRECT_PASSWORD) {
                setAuth();
                window.location.href = 'index.html';
            } else {
                passwordInput.classList.add('error');
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();

                // Remove error styling after a delay
                setTimeout(() => {
                    passwordInput.classList.remove('error');
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });

        // Check authentication on page load
        checkAuth();
    </script>
</body>
</html>
